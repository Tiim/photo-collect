{{define "base"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
<title>{{.Title}} · Photo Collect</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body{{if .CSRF}} hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}'{{end}}>
<header class="topbar">
  <a class="brand" href="/">Photo Collect</a>
  {{if .Session}}
  <nav>
    <a href="/folders">{{call .T "nav.folders"}}</a>
    <span class="who">{{.Session.DisplayName}}</span>
    <form method="post" action="/auth/logout" class="inline">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button type="submit" class="link">{{call .T "nav.sign_out"}}</button>
    </form>
  </nav>
  {{end}}
</header>
<main>
{{template "content" .}}
</main>
<footer class="langs" aria-label="{{call .T "lang.switch"}}">
  {{range .Langs}}{{if .Current}}<strong lang="{{.Code}}">{{.Name}}</strong>{{else}}<a href="{{.URL}}" lang="{{.Code}}" hreflang="{{.Code}}">{{.Name}}</a>{{end}} {{end}}
</footer>
<div id="modal" class="modal" hidden></div>
</body>
</html>{{end}}
