{{define "exports"}}
<div id="exports"{{if .Active}} hx-get="/folders/{{.FolderID}}/downloads" hx-trigger="every 3s" hx-swap="outerHTML"{{end}}>
  {{range .Exports}}
  <div class="export">{{date .CreatedAt}} ·
    {{if .Ready}}<a href="/downloads/{{.ID}}">Download ZIP ({{humanSize .SizeBytes.Int64}})</a> <span class="muted small">expires {{date .ExpiresAt}}</span>
    {{else if eq .Status "failed"}}<span class="error">Failed</span>
    {{else}}Preparing…{{end}}
  </div>
  {{else}}<p class="muted">No downloads yet.</p>{{end}}
</div>
{{end}}
