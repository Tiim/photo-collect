{{define "upload_link"}}
<div id="upload-link" hx-target="this" hx-swap="outerHTML">
{{if .Exists}}
  <div class="row"><input id="link-url" type="text" readonly value="{{.URL}}"><button type="button" class="secondary" data-copy="#link-url">{{t "link.copy"}}</button></div>
  <p>{{if .Expired}}{{th "link.expired_on" (dict "Date" (date .ExpiresAt))}}{{else}}{{t "link.expires" (dict "Date" (date .ExpiresAt))}}{{end}}</p>
  <form hx-post="/folders/{{.FolderID}}/upload-link/extend" class="row">
    <label>{{t "link.valid_for"}} <input type="number" name="days" value="{{.DefaultDays}}" min="1" max="365" class="days"> {{t "link.days_from_now"}}</label>
    <button type="submit">{{t "link.extend"}}</button>
  </form>
  <div class="row">
    <button type="button" class="secondary" hx-post="/folders/{{.FolderID}}/upload-link"
            hx-confirm="{{t "link.regenerate_confirm"}}">{{t "link.regenerate"}}</button>
    <button type="button" class="danger" hx-post="/folders/{{.FolderID}}/upload-link/revoke"
            hx-confirm="{{t "link.revoke_confirm"}}">{{t "link.revoke"}}</button>
  </div>
{{else}}
  <p class="muted">{{t "link.none"}}</p>
  <form hx-post="/folders/{{.FolderID}}/upload-link" class="row">
    <label>{{t "link.valid_for"}} <input type="number" name="days" value="{{.DefaultDays}}" min="1" max="365" class="days"> {{t "link.days"}}</label>
    <button type="submit">{{t "link.create"}}</button>
  </form>
{{end}}
</div>
{{end}}
