{{define "duplicates_panel"}}
{{if .Clusters}}
<section class="panel duplicates" id="duplicates-{{.FolderID}}">
<details{{if .Open}} open{{end}}>
  <summary><h2>{{t "dup.title"}} <span class="muted small">({{len .Clusters}})</span></h2></summary>
  {{$folderID := .FolderID}}
  {{range .Clusters}}
  {{$c := .}}
  <div class="dup-cluster" id="dup-{{.ID}}">
    <div class="dup-images">
    {{range .Images}}
    <div class="dup-side">
      <a href="/images/{{.ID}}" hx-get="/images/{{.ID}}" hx-target="#modal" hx-swap="innerHTML">
        <img src="/images/{{.ID}}/thumbnail" loading="lazy" alt="{{.Filename}}">
      </a>
      <span class="muted small" title="{{.Filename}}">{{.Filename}}</span>
      <button hx-post="/duplicates/{{$c.ID}}/resolve" hx-vals='{"keep":"{{.ID}}"}' hx-target="#duplicates-{{$folderID}}" hx-swap="outerHTML"
              hx-confirm="{{t "dup.keep_confirm"}}">{{t "dup.keep"}}</button>
      {{if gt (len $c.Images) 2}}
      <button class="secondary" hx-post="/duplicates/{{$c.ID}}/exclude" hx-vals='{"image":"{{.ID}}"}' hx-target="#duplicates-{{$folderID}}" hx-swap="outerHTML">{{t "dup.exclude"}}</button>
      {{end}}
    </div>
    {{end}}
    </div>
    <div class="dup-meta">
      <span class="muted small">{{t "dup.similar" (dict "Count" (len .Images))}}</span>
      <button class="secondary" hx-post="/duplicates/{{.ID}}/dismiss" hx-target="#duplicates-{{$folderID}}" hx-swap="outerHTML">{{t "dup.dismiss"}}</button>
    </div>
  </div>
  {{end}}
</details>
</section>
{{end}}
{{end}}
