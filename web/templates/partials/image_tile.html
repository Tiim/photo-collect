{{define "image_tile"}}<div class="tile" id="tile-{{.ID}}"{{if not (or .ThumbnailReady .IsVideo)}} hx-get="/images/{{.ID}}/tile" hx-trigger="load delay:3s" hx-target="this" hx-swap="outerHTML"{{end}}>
  <input type="checkbox" name="image" value="{{.ID}}" form="select-form" class="sel" aria-label="{{t "tile.select" (dict "Name" .OriginalFilename)}}">
  <a class="thumb" href="/images/{{.ID}}" hx-get="/images/{{.ID}}" hx-target="#modal" hx-swap="innerHTML">
    {{if .ThumbnailReady}}<img src="/images/{{.ID}}/thumbnail" loading="lazy" alt="{{.OriginalFilename}}">{{else if .IsVideo}}{{template "video_placeholder"}}{{else}}<div class="placeholder">{{t "tile.processing"}}</div>{{end}}
  </a>
  <div class="caption"><span class="name" title="{{.OriginalFilename}}">{{.OriginalFilename}}</span><span class="muted small">{{.UploaderNickname}}</span>
    <span id="tile-rating-{{.ID}}" class="stars">{{template "stars" .RatingValue}}</span></div>
</div>{{end}}

{{define "video_placeholder"}}<div class="placeholder video"><svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><rect x="2" y="5" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 10l6-4v12l-6-4z" fill="currentColor"/></svg><span>{{t "tile.video"}}</span></div>{{end}}
