{{define "content"}}
<h1>{{t "folders.title"}}</h1>
<form method="post" action="/folders" class="row">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="text" name="name" placeholder="{{t "folders.new_placeholder"}}" maxlength="100" required>
  <button type="submit">{{t "folders.create"}}</button>
</form>
{{if .Data}}
<ul class="folder-list">
  {{range .Data}}
  <li><a href="/folders/{{.ID}}">{{.Name}}</a> <span class="muted">{{t "folders.item" (dict "Count" .ImageCount "Date" (date .CreatedAt))}}</span></li>
  {{end}}
</ul>
{{else}}
<p class="muted">{{t "folders.empty"}}</p>
{{end}}
{{end}}
