{{define "content"}}
<h1>Folders</h1>
<form method="post" action="/folders" class="row">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="text" name="name" placeholder="New folder name" maxlength="100" required>
  <button type="submit">Create folder</button>
</form>
{{if .Data}}
<ul class="folder-list">
  {{range .Data}}
  <li><a href="/folders/{{.ID}}">{{.Name}}</a> <span class="muted">{{.ImageCount}} images · created {{date .CreatedAt}}</span></li>
  {{end}}
</ul>
{{else}}
<p class="muted">No folders yet. Create one to start collecting photos.</p>
{{end}}
{{end}}
