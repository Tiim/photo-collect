{{define "content"}}
<div class="clock-page">
  <h1>{{t "clock.title"}}</h1>
  <p class="muted">{{th "clock.intro"}}</p>

  <div class="clock-card">
    <div id="clock-qr" class="clock-qr" aria-label="{{t "clock.qr_label"}}"></div>
    <div id="clock-time" class="clock-time">--:--:--</div>
    <div id="clock-date" class="clock-date">&nbsp;</div>
  </div>
  <p id="clock-status" class="muted small" role="status"></p>
  <noscript><p class="error">{{t "clock.noscript"}}</p></noscript>

  <p class="row">
    {{if .Session}}
    <a class="button" href="/folders">{{t "clock.go_folders"}}</a>
    {{else}}
    <a class="button" href="/auth/login">{{t "clock.sign_in"}}</a>
    {{end}}
  </p>
</div>
<script src="{{static "qrcode.js"}}" defer></script>
<script src="{{static "clock.js"}}" defer></script>
{{end}}
