{{define "content"}}
{{with .Data}}
<p><a href="/folders/{{.Folder.ID}}">← {{.Folder.Name}}</a></p>
<h1>{{t "trash.title"}} {{template "trash_count" .Counts}}</h1>
<p class="muted small">{{t "trash.hint"}}</p>

<form id="trash-form" class="row toolbar">
  <button type="button" hx-post="/folders/{{.Folder.ID}}/images/restore" hx-target="#trash-grid" hx-swap="innerHTML">{{t "trash.restore_selected"}}</button>
  <button type="button" class="danger" hx-post="/folders/{{.Folder.ID}}/images/purge" hx-target="#trash-grid" hx-swap="innerHTML"
          hx-confirm="{{t "trash.purge_confirm"}}">{{t "trash.purge"}}</button>
  <button type="button" data-select-all class="secondary">{{t "select_all_loaded"}}</button>
</form>

<div id="trash-grid" class="grid">
  {{template "trash_grid" .Grid}}
</div>
{{end}}
{{end}}
